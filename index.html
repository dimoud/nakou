<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Γεωργία Νάκου · Δικηγόρος — Αθήνα · Θεσσαλονίκη</title>
<meta name="description" content="Δικηγορικό γραφείο Γεωργίας Νάκου. Ακίνητα, συμβόλαια, ιδιωτικά συμφωνητικά, συντάξεις e-ΕΦΚΑ. Αθήνα · Θεσσαλονίκη.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#14100B; --bg2:#1C1711; --panel:#211B14;
  --cream:#F1ECE2; --parch:#EDE7DC; --ivory:#F7F3EB;
  --gold:#C9A35E; --gold-lt:#E6C988; --gold-dim:rgba(201,163,94,.16);
  --ink:#1A1510; --muted:#9C9183; --muted-d:#6E655A;
  --line:rgba(201,163,94,.2); --line-l:#D8CFC0;
  --px:clamp(22px,5.5vw,110px); --ps:clamp(80px,11vh,150px); --maxw:1280px;
  --ease:cubic-bezier(.16,1,.3,1);
}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--cream);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;text-wrap:pretty}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;line-height:1.06;letter-spacing:-.01em}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer;background:none;border:none;color:inherit}
::selection{background:var(--gold);color:var(--ink)}
.wrap{max-width:var(--maxw);margin:0 auto}
.section{padding:var(--ps) var(--px);position:relative}
.label{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);font-weight:500;margin-bottom:20px}
.label.gold{color:var(--gold-lt)}
.display{font-size:clamp(34px,5vw,68px);line-height:1.04}
.display.on-dark{color:var(--ivory)}
.mb{margin-bottom:clamp(40px,6vw,72px)}

/* chrome */
.scroll-progress{position:fixed;top:0;left:0;height:2px;width:100%;background:linear-gradient(90deg,var(--gold),var(--gold-lt));transform-origin:left;transform:scaleX(0);z-index:600;will-change:transform}
.cur-dot,.cur-ring{position:fixed;top:0;left:0;pointer-events:none;z-index:9999;border-radius:50%;mix-blend-mode:difference;will-change:transform}
.cur-dot{width:6px;height:6px;background:#fff;margin:-3px}
.cur-ring{width:34px;height:34px;border:1px solid rgba(255,255,255,.55);margin:-17px;transition:width .3s var(--ease),height .3s var(--ease),margin .3s var(--ease),background .3s,border-color .3s}
.cur-ring.big{width:62px;height:62px;margin:-31px;background:var(--gold-dim);border-color:var(--gold)}
@media(pointer:coarse){.cur-dot,.cur-ring{display:none}}

/* emblem */
.emblem{color:var(--gold);overflow:visible}
.emblem-beam{transform-origin:50px 14px;animation:sway 5.5s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-2.2deg)}50%{transform:rotate(2.2deg)}}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:10px;padding:15px 34px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;transition:all .35s var(--ease);position:relative;overflow:hidden;white-space:nowrap}
.btn-gold{background:var(--gold);color:var(--ink)}
.btn-gold:hover{background:var(--gold-lt);box-shadow:0 14px 40px -12px rgba(201,163,94,.6)}
.btn-ghost{border:1px solid var(--line);color:var(--cream)}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold)}
.btn .arr,.btn .arr{transition:transform .35s var(--ease)}
.btn:hover .arr{transform:translateX(5px)}
.btn.full{width:100%;justify-content:center}
.magnetic{will-change:transform;transition:transform .25s var(--ease),background .35s,box-shadow .35s,color .35s,border-color .35s}

/* reveal */
.reveal{opacity:0;transform:translateY(30px);transition:opacity 1s var(--ease),transform 1s var(--ease)}
.reveal.in{opacity:1;transform:none}
.fade-up{opacity:0;transform:translateY(26px);animation:fadeUp 1s var(--ease) forwards}
@keyframes fadeUp{to{opacity:1;transform:none}}
.d1{animation-delay:.1s}.d2{animation-delay:.25s}.d3{animation-delay:.4s}.d4{animation-delay:.85s}.d5{animation-delay:1s}.d6{animation-delay:1.15s}

.scroll-top{position:fixed;bottom:32px;right:32px;z-index:490;width:46px;height:46px;border:1px solid var(--gold);background:rgba(20,16,11,.82);backdrop-filter:blur(10px);color:var(--gold);font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transform:translateY(16px);transition:opacity .4s var(--ease),transform .4s var(--ease),background .3s,border-color .3s;pointer-events:none}
.scroll-top.scroll-top-show{opacity:1;transform:none;pointer-events:auto}
.scroll-top:hover{background:var(--gold);color:var(--ink)}
/* ═══ NAV ═══ */
.nav{position:fixed;top:0;left:0;right:0;z-index:500;height:70px;padding:0 var(--px);display:flex;align-items:center;justify-content:space-between;gap:30px;transition:background .4s,backdrop-filter .4s,border-color .4s;border-bottom:1px solid transparent}
.nav.solid{background:rgba(20,16,11,.82);backdrop-filter:blur(14px);border-bottom-color:var(--line)}
.nav-brand{display:flex;align-items:center;gap:11px}
.nav-emblem{width:36px;height:37px}
.nav-emblem .emblem-beam{animation:none}
.nav-brand-name{font-family:'Cormorant Garamond',serif;font-size:21px;color:var(--ivory);letter-spacing:.01em}
.nav-links{display:flex;gap:30px}
.nav-link{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--cream);opacity:.72;position:relative;padding:6px 0}
.nav-link::after{content:'';position:absolute;left:0;bottom:0;height:1px;width:0;background:var(--gold);transition:width .35s var(--ease)}
.nav-link:hover{opacity:1}.nav-link:hover::after{width:100%}
.nav-right{display:flex;align-items:center;gap:20px}
.lang{display:flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.1em;color:var(--muted)}
.lang button{color:var(--muted);transition:color .25s}
.lang button.on{color:var(--gold)}
.nav-cta{font-size:12.5px;letter-spacing:.04em;color:var(--cream);white-space:nowrap}
.nav-cta:hover{color:var(--gold)}
.burger{display:none;flex-direction:column;gap:5px;width:26px;padding:6px 0}
.burger span{height:1.5px;width:100%;background:var(--cream);transition:.3s var(--ease)}
.burger span.x:first-child{transform:translateY(6.5px) rotate(45deg)}
.burger span.x:last-child{transform:translateY(-6.5px) rotate(-45deg)}
.nav-drawer{position:fixed;top:70px;left:0;right:0;background:rgba(20,16,11,.97);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;flex-direction:column;padding:0 var(--px);max-height:0;overflow:hidden;transition:max-height .45s var(--ease),padding .45s}
.nav-drawer.open{max-height:60vh;padding:18px var(--px) 28px}
.nav-drawer button,.nav-drawer a{text-align:left;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--cream);padding:14px 0;border-bottom:1px solid var(--line)}
.nav-drawer a{color:var(--gold);border:none}

/* ═══ HERO ═══ */
.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:120px var(--px) 90px;position:relative;overflow:hidden;background:radial-gradient(140% 120% at 50% -10%,#2E1E0A 0%,#1A1208 35%,var(--bg) 65%)}
.hero-particles{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.hero-beam{position:absolute;top:0;left:-20%;width:60%;height:100%;background:linear-gradient(108deg,transparent 38%,rgba(201,163,94,.035) 46%,rgba(230,201,136,.07) 50%,rgba(201,163,94,.035) 54%,transparent 62%);pointer-events:none;z-index:1;animation:beamSweep 20s ease-in-out infinite}
.hero-beam-2{animation-delay:10s;opacity:.6}
@keyframes beamSweep{0%,100%{transform:translateX(-40%) skewX(-8deg)}50%{transform:translateX(120%) skewX(-8deg)}}
.hero-glow{position:absolute;top:-20%;left:50%;transform:translateX(-50%);width:80vw;height:80vw;max-width:900px;max-height:900px;background:radial-gradient(circle,rgba(201,163,94,.13) 0%,transparent 60%);pointer-events:none;animation:glowPulse 7s ease-in-out infinite}
@keyframes glowPulse{0%,100%{opacity:.7}50%{opacity:1}}
.hero-emblem-bg{position:absolute;width:min(70vh,640px);height:auto;opacity:.04;color:var(--gold);top:50%;left:50%;transform:translate(-50%,-46%);pointer-events:none;will-change:transform}
.hero-emblem-bg svg{width:100%;height:auto;display:block}
.hero-emblem-bg .emblem-beam{animation:sway 9s ease-in-out infinite}
.hero-inner{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;max-width:920px;will-change:transform,opacity;padding:clamp(36px,5vw,64px) clamp(32px,6vw,80px)}
.hero-badge{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);margin-bottom:30px}
.hero-emblem{width:54px;height:56px;margin-bottom:26px}
.hero-emblem-draw{opacity:0;transform:scale(.4) rotate(-12deg);transform-origin:50% 60%;animation:emblemIn 1.3s var(--ease) .15s forwards}
@keyframes emblemIn{60%{opacity:1}to{opacity:1;transform:none}}
.hero-name{font-size:clamp(58px,13vw,168px);font-weight:300;color:var(--ivory);line-height:.94;display:flex;flex-wrap:wrap;justify-content:center;gap:0 .26em}
.hero-word{display:inline-flex}
.hero-letter{display:inline-block;overflow:hidden;padding:.06em .005em}
.hero-letter-i{display:inline-block;transform:translateY(118%);animation:maskUp 1.05s var(--ease) forwards}
@keyframes maskUp{to{transform:none}}
.hero-role{font-size:clamp(12px,1.6vw,16px);letter-spacing:.5em;text-transform:uppercase;color:var(--gold);margin-top:14px;padding-left:.5em}
.hero-rule{width:64px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:30px 0}
.hero-tag{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(20px,2.6vw,30px);color:var(--cream);font-weight:300}
.hero-cta-row{display:flex;gap:16px;margin-top:38px;flex-wrap:wrap;justify-content:center}
.hero-info{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:28px;padding:18px 40px;border:1px solid rgba(201,163,94,.45);background:rgba(201,163,94,.07);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);opacity:0;animation:heroInfoIn 1s var(--ease) 1.5s forwards;position:relative;box-shadow:0 4px 24px rgba(0,0,0,.2),inset 0 1px 0 rgba(201,163,94,.1)}
.hero-info::before{content:'';position:absolute;inset:-1px;border:1px solid rgba(201,163,94,.25);transform:scale(1.06);pointer-events:none}
@keyframes heroInfoIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.hero-info-item{font-size:12.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--cream);transition:color .3s}.hero-info-item:hover{color:var(--gold-lt)}
.hero-info-phones{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
.hero-info-sep{width:40px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:2px 0}
.scroll-cue{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);width:24px;height:38px;border:1px solid var(--line);border-radius:14px;display:flex;justify-content:center;padding-top:7px;z-index:2}
.scroll-cue span{width:3px;height:7px;background:var(--gold);border-radius:2px;animation:scrolldot 1.8s ease-in-out infinite}
@keyframes scrolldot{0%{opacity:0;transform:translateY(-4px)}40%{opacity:1}80%,100%{opacity:0;transform:translateY(11px)}}

/* ═══ MARQUEE ═══ */
.marquee{background:var(--gold);overflow:hidden;padding:17px 0;position:relative;z-index:3}
.marquee-track{display:flex;width:max-content;animation:scrollx 30s linear infinite}
@keyframes scrollx{to{transform:translateX(-33.333%)}}
.marquee-item{display:inline-flex;align-items:center;font-size:13px;letter-spacing:.26em;text-transform:uppercase;font-weight:500;color:var(--ink);padding:0 8px}
.marquee-dot{font-style:normal;font-size:8px;margin:0 26px;opacity:.55}

/* ═══ ABOUT ═══ */
.about{background:var(--parch);color:var(--ink)}
.about-grid{display:grid;grid-template-columns:.85fr 1.15fr;gap:clamp(44px,7vw,100px);align-items:center}
.about-portrait{display:flex;flex-direction:column;gap:18px}
.portrait-frame{position:relative;width:clamp(324px,38vw,486px);aspect-ratio:1;border-radius:50%;overflow:hidden;border:2px solid var(--gold);animation:portraitPulse 3.5s ease-in-out infinite;align-self:center}
.portrait-frame::before{content:'';position:absolute;inset:0;border-radius:50%;border:6px solid transparent;pointer-events:none;z-index:2}
@keyframes portraitPulse{
  0%,100%{box-shadow:0 0 0 6px rgba(201,163,94,.18),0 0 40px rgba(201,163,94,.18),0 20px 60px -20px rgba(26,21,16,.6)}
  50%{box-shadow:0 0 0 14px rgba(201,163,94,.07),0 0 80px rgba(201,163,94,.32),0 20px 60px -20px rgba(26,21,16,.6)}
}
.portrait-frame img{width:100%;height:100%;object-fit:cover;object-position:center 12%;filter:grayscale(.08) contrast(1.03)}
.portrait-cap{display:flex;align-items:center;justify-content:center;gap:10px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted-d);text-align:center;margin-top:24px}
.cap-emblem{width:16px;height:17px}.cap-emblem .emblem-beam{animation:none}
.about-text .label{color:var(--gold)}
.about-text .display{color:var(--ink);max-width:14ch}
.about-bio{font-family:'Cormorant Garamond',serif;font-size:clamp(20px,2.4vw,27px);line-height:1.5;color:#3A332A;margin:26px 0 30px;font-weight:300;max-width:30ch}
.about-bio-list{display:flex;flex-direction:column;gap:14px;margin:26px 0 30px}
.about-bio-item{display:flex;align-items:center;gap:16px;font-family:'Cormorant Garamond',serif;font-size:clamp(20px,2.4vw,27px);line-height:1.4;color:#3A332A;font-weight:300}
.about-bio-bullet{width:6px;height:6px;border-radius:50%;background:var(--gold);flex-shrink:0}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:inline-flex;align-items:center;gap:9px;font-size:12.5px;letter-spacing:.02em;padding:9px 16px;border:1px solid var(--line-l);background:var(--ivory);color:#4A4238}
.chip i{width:5px;height:5px;border-radius:50%;background:var(--gold)}

/* ═══ STATS ═══ */
.stats{background:var(--bg);padding:clamp(56px,8vw,90px) var(--px);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.stat{text-align:center;opacity:0;transform:translateY(24px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.stats-grid.in .stat{opacity:1;transform:none}
.stat-val{font-family:'Cormorant Garamond',serif;font-size:clamp(46px,6vw,82px);font-weight:300;color:var(--gold);line-height:1}
.stat-label{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:12px}

/* ═══ SERVICES ═══ */
.services{background:var(--ivory);color:var(--ink)}
.services .label{color:var(--gold)}.services .display{color:var(--ink)}
.svc-list{border-top:1px solid var(--line-l)}
.svc-item{border-bottom:1px solid var(--line-l)}
.svc-row{display:grid;grid-template-columns:auto 1fr auto;gap:clamp(20px,4vw,56px);align-items:start;padding:clamp(26px,3.4vw,40px) 0;border-bottom:none;cursor:pointer;transition:padding-left .4s var(--ease),background .4s}
.svc-row:hover{padding-left:20px;background:linear-gradient(90deg,var(--gold-dim),transparent)}
.svc-n{font-family:'Cormorant Garamond',serif;font-size:clamp(20px,2vw,26px);color:var(--gold);font-weight:400;padding-top:6px}
.svc-main{display:flex;flex-direction:column}
.svc-title{font-size:clamp(26px,3.4vw,42px);color:var(--ink);transition:color .35s}
.svc-row:hover .svc-title{color:#6E5526}
.svc-detail-wrap{max-height:0;overflow:hidden;transition:max-height .55s var(--ease),opacity .4s var(--ease);opacity:0}
.svc-open .svc-detail-wrap{max-height:160px;opacity:1}
.svc-detail{font-size:15px;color:var(--muted-d);line-height:1.75;padding-top:14px;max-width:100%}
.svc-desc{font-size:14.5px;color:var(--muted-d);padding-top:10px}
.svc-arrow{font-size:22px;color:var(--gold);opacity:0;transform:translate(-8px,8px);transition:all .4s var(--ease);padding-top:6px}
.svc-row:hover .svc-arrow{opacity:1;transform:none}

/* ═══ CREED (cinematic pull-quote) ═══ */
.creed{background:var(--bg);padding:clamp(96px,16vh,200px) var(--px);position:relative;overflow:hidden;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.creed-glow{position:absolute;top:50%;left:50%;width:80vw;height:80vw;max-width:900px;max-height:900px;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(201,163,94,.1),transparent 62%);pointer-events:none;transition:opacity .3s}
.creed-emblem{position:absolute;right:-4%;top:50%;width:min(58vh,520px);color:var(--gold);opacity:.05;pointer-events:none;will-change:transform}
.creed-emblem svg{width:100%;height:auto;display:block}
.creed-emblem .emblem-beam{animation:sway 9s ease-in-out infinite}
.creed-inner{position:relative;z-index:1;max-width:960px}
.creed-label{margin-bottom:24px}
.creed-mark{display:block;font-family:'Cormorant Garamond',serif;font-size:clamp(120px,18vw,240px);line-height:.6;color:var(--gold);opacity:.5;height:.42em;margin-bottom:.1em}
.creed-quote{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(30px,5vw,68px);line-height:1.18;color:var(--ivory);max-width:22ch;border:none;padding:0}
.creed-cite{display:flex;align-items:center;gap:22px;margin-top:clamp(34px,5vw,52px)}
.creed-rule{width:clamp(40px,8vw,90px);height:1px;background:linear-gradient(90deg,var(--gold),transparent);flex-shrink:0}
.creed-by{display:flex;flex-direction:column;gap:5px}
.creed-name{font-family:'Cormorant Garamond',serif;font-size:clamp(22px,2.6vw,30px);color:var(--gold-lt);line-height:1}
.creed-role{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--muted)}

/* ═══ EFKA ═══ */
.efka{background:var(--bg2);text-align:center;overflow:hidden}
.efka-glow{position:absolute;inset:0;background:radial-gradient(60% 90% at 50% 50%,rgba(201,163,94,.1),transparent 70%);pointer-events:none}
.efka-inner{position:relative;max-width:760px;margin:0 auto;display:flex;flex-direction:column;align-items:center}
.efka-badge{display:inline-block;border:1px solid var(--gold);color:var(--gold);font-size:10px;letter-spacing:.26em;padding:6px 16px;text-transform:uppercase;margin-bottom:30px}
.efka-title{font-size:clamp(29px,4.25vw,54px);color:var(--ivory);margin-bottom:22px;white-space:nowrap}
.efka-desc{font-family:'Cormorant Garamond',serif;font-size:clamp(19px,2.3vw,26px);font-weight:300;color:var(--cream);line-height:1.5;margin-bottom:38px;max-width:52ch}

/* ═══ REVIEWS ═══ */
.reviews{background:var(--parch);color:var(--ink);overflow:hidden}
.reviews-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:clamp(34px,5vw,56px)}
.reviews .label{color:var(--gold)}.reviews .display{color:var(--ink)}
.g-badge{display:flex;align-items:center;gap:14px}
.g-logo{width:42px;height:42px;border-radius:50%;background:#fff;border:1px solid var(--line-l);color:#4285F4;font-weight:700;font-size:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.g-stars{font-size:14px;color:#E0A93B;letter-spacing:1px}.g-stars b{color:var(--ink);margin-left:6px}
.g-sub{font-size:12px;color:var(--muted-d);letter-spacing:.04em;margin-top:2px}
.rev-rows{display:flex;flex-direction:column;gap:18px}
.rev-rowwrap{overflow:hidden;-webkit-mask:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);mask:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}
.rev-track{display:flex;gap:18px;width:max-content;animation:revx 120s linear infinite}
.rev-track.rev{animation-direction:reverse}

@keyframes revx{to{transform:translateX(-50%)}}
.rev-card{width:330px;flex-shrink:0;background:var(--ivory);border:1px solid var(--line-l);padding:26px 26px 22px;display:flex;flex-direction:column;gap:13px;transition:border-color .35s,transform .35s var(--ease)}
.rev-card:hover{border-color:var(--gold);transform:translateY(-4px)}
.rev-stars{color:#E0A93B;font-size:13px;letter-spacing:1px}
.rev-text{font-family:'Cormorant Garamond',serif;font-size:19px;line-height:1.5;color:#3A332A;flex:1;font-weight:400}
.rev-foot{display:flex;align-items:center;gap:10px}
.rev-av{width:30px;height:30px;border-radius:50%;background:var(--gold);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0}
.rev-name{font-size:12.5px;font-weight:500;color:var(--ink)}
.rev-date{font-size:11px;color:var(--muted-d);margin-left:auto}

/* ═══ NEWS + LINKS ═══ */
.news-links{background:var(--bg)}
.news-links .label{color:var(--gold)}.news-links .display{color:var(--ivory)}
.news-header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:clamp(24px,3vw,36px)}
.news-nav{display:flex;align-items:center;gap:12px}
.news-nav-btn{width:42px;height:42px;border:1px solid var(--line);color:var(--gold);font-size:18px;display:flex;align-items:center;justify-content:center;transition:.3s var(--ease)}
.news-nav-btn:hover{border-color:var(--gold);background:var(--gold-dim)}
.news-nav-count{font-size:12px;letter-spacing:.12em;color:var(--muted);min-width:40px;text-align:center}
.nl-news-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.nl-divider{display:flex;align-items:center;gap:20px;margin:clamp(48px,7vw,80px) 0 clamp(16px,2vw,24px);border-top:1px solid var(--line)}
.nl-divider-label{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);font-weight:500;margin-top:-10px;background:var(--bg);padding:0 16px}
.news-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.news-card{border:1px solid var(--line);background:var(--bg2);padding:clamp(30px,3.4vw,44px);display:flex;flex-direction:column;gap:14px;transition:border-color .35s,transform .35s var(--ease),background .35s}
.news-card:hover{border-color:var(--gold);transform:translateY(-5px);background:var(--panel)}
.news-tag{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);border:1px solid var(--line);padding:5px 12px;align-self:flex-start;border-radius:40px}
.news-title{font-size:clamp(23px,2.6vw,30px);color:var(--ivory)}
.news-desc{font-size:14.5px;color:var(--muted);line-height:1.7;flex:1}
.news-link{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);align-self:flex-start;transition:gap .3s}
.news-link:hover{opacity:.75}

/* ═══ LINKS carousel ═══ */
.links-scroll-wrap{overflow:hidden;-webkit-mask:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);margin-top:8px}
.links-track{display:flex;gap:14px;width:max-content;animation:scrollx 55s linear infinite}
.links-track:hover{animation-play-state:paused}
.link-pill{display:inline-flex;flex-direction:column;gap:7px;flex-shrink:0;width:240px;padding:26px 26px 22px;border:1px solid var(--line);background:var(--bg2);transition:border-color .35s,background .35s,transform .3s var(--ease);text-decoration:none;position:relative}
.link-pill:hover{border-color:var(--gold);background:var(--panel);transform:translateY(-4px)}
.link-pill-title{font-family:'Cormorant Garamond',serif;font-size:24px;color:var(--ivory);line-height:1.1}
.link-pill-desc{font-size:12.5px;letter-spacing:.04em;color:var(--muted);line-height:1.5}
.link-pill-arr{position:absolute;top:16px;right:18px;color:var(--gold);font-size:15px;opacity:.5;transition:.3s var(--ease)}
.link-pill:hover .link-pill-arr{opacity:1;transform:translate(2px,-2px)}

/* ═══ MANIFESTO ═══ */
.manifesto{background:var(--bg);padding:clamp(110px,20vh,220px) var(--px);position:relative;overflow:hidden;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.manifesto-glow{position:absolute;top:50%;left:50%;width:70vw;height:70vw;max-width:760px;max-height:760px;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(201,163,94,.12),transparent 62%);pointer-events:none;transition:opacity .3s}
.manifesto-text{position:relative;max-width:1000px;margin:0 auto;text-align:center;font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(30px,5.4vw,72px);line-height:1.22;color:var(--ivory)}
.mf-w{display:inline-block;will-change:opacity,transform;transition:color .3s;margin-right:0.28em}

/* ═══ JOURNEY (scrollytelling) ═══ */
.journey{background:var(--bg2);overflow:hidden}
.journey-grid{display:grid;grid-template-columns:.95fr 1.05fr;gap:clamp(40px,7vw,110px);align-items:start}
.journey .label{color:var(--gold)}
.journey-sticky{position:sticky;top:120px}
.journey-intro{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(19px,2.2vw,25px);line-height:1.5;color:var(--cream);margin:24px 0 44px;max-width:30ch}
.journey-counter{display:flex;align-items:stretch;gap:24px}
.jc-num{position:relative;font-family:'Cormorant Garamond',serif;font-weight:300}
.jc-n{display:block;font-size:clamp(52px,7vw,96px);line-height:1.04;color:var(--muted-d);opacity:.32;transition:opacity .5s var(--ease),color .5s var(--ease),transform .5s var(--ease);transform:translateX(0)}
.jc-n.on{opacity:1;color:var(--gold);transform:translateX(6px)}
.jc-bar{width:2px;background:var(--line);align-self:stretch;position:relative;overflow:hidden}
.jc-bar span{position:absolute;inset:0;background:linear-gradient(var(--gold),var(--gold-lt));transform-origin:top;transform:scaleY(.25);transition:transform .6s var(--ease)}
.journey-steps{list-style:none;display:flex;flex-direction:column;gap:clamp(20px,3vw,30px);padding:10px 0 40px}
.journey-step{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:start;padding:clamp(26px,3vw,38px);border:1px solid var(--line);background:rgba(20,16,11,.4);transition:border-color .5s var(--ease),background .5s var(--ease),transform .5s var(--ease),opacity .5s;opacity:.5}
.journey-step.on{opacity:1;border-color:var(--gold);background:var(--panel);transform:translateX(8px)}
.js-n{font-family:'Cormorant Garamond',serif;font-size:clamp(22px,2.4vw,30px);color:var(--gold);line-height:1;padding-top:4px;min-width:42px}
.js-title{font-size:clamp(24px,3vw,36px);color:var(--ivory);margin-bottom:10px}
.js-desc{font-size:15px;color:var(--muted);line-height:1.7;max-width:42ch}

.journey .display{font-size:clamp(29px,4.25vw,58px)}

/* ═══ CONTACT (redesigned) ═══ */
.contact{background:var(--bg);color:var(--cream);position:relative;overflow:hidden}
.contact-bg{position:absolute;inset:0;background:radial-gradient(90% 70% at 80% 0%,rgba(201,163,94,.08),transparent 60%);pointer-events:none}
.contact-emblem-bg{position:absolute;right:-6%;bottom:-10%;width:min(46vh,440px);color:var(--gold);opacity:.045;pointer-events:none;z-index:0}
.contact-emblem-bg .emblem-beam{animation:sway 9s ease-in-out infinite}
.contact .wrap{position:relative;z-index:1}
.contact .label{color:var(--gold)}
.contact-head{margin-bottom:clamp(40px,6vw,64px);max-width:60ch}
.contact-sub{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(19px,2.2vw,26px);color:var(--cream);margin-top:18px;max-width:40ch;line-height:1.5}
.contact-grid{display:grid;grid-template-columns:.85fr 1.15fr;gap:clamp(34px,5vw,72px);align-items:start}
.contact-info{display:flex;flex-direction:column;gap:clamp(26px,3.4vw,40px)}
.ci-cap{display:block;font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);margin-bottom:18px}
.ci-block{display:flex;flex-direction:column}
.ci{display:flex;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid var(--line);color:var(--cream);transition:padding-left .35s var(--ease),color .35s}
.ci.hoverable:hover{padding-left:8px;color:var(--gold-lt)}
.ci-ic{width:42px;height:42px;border:1px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--gold);flex-shrink:0;transition:border-color .35s,background .35s}
.ci.hoverable:hover .ci-ic{border-color:var(--gold);background:var(--gold-dim)}
.ci-txt{display:flex;flex-direction:column;gap:3px;font-size:15.5px}
.ci-txt b{font-weight:500;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.ci-go{margin-left:auto;color:var(--gold);opacity:0;transform:translate(-6px,4px);transition:.35s var(--ease)}
.ci.hoverable:hover .ci-go{opacity:1;transform:none}
.ci-cities{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ci-city{display:flex;align-items:center;gap:12px;padding:16px 18px;border:1px solid var(--line);background:rgba(20,16,11,.4);transition:border-color .35s,background .35s}
.ci-city:hover{border-color:var(--gold);background:var(--panel)}
.ci-city-dot{width:7px;height:7px;border-radius:50%;background:var(--gold);flex-shrink:0;box-shadow:0 0 0 4px var(--gold-dim)}
.ci-city-name{font-family:'Cormorant Garamond',serif;font-size:21px;color:var(--ivory);line-height:1}
.ci-city-note{font-size:11px;letter-spacing:.06em;color:var(--muted);margin-top:5px}
.ci-social{display:flex;align-items:center;gap:12px;align-self:flex-start;font-size:13px;letter-spacing:.06em;color:var(--cream);padding:12px 22px;border:1px solid var(--line);transition:border-color .35s,color .35s}
.ci-social:hover{border-color:var(--gold);color:var(--gold)}
.ci-social .ci-ic{width:30px;height:30px;font-size:14px}
.ci-calendly{display:flex;align-items:center;gap:14px;padding:20px 24px;border:1px solid var(--gold);background:var(--gold-dim);color:var(--cream);transition:background .35s,border-color .35s,padding-left .35s var(--ease);width:100%;align-self:stretch;box-sizing:border-box;animation:calendlyPulse 3s ease-in-out infinite}
@keyframes calendlyPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(201,163,94,.25),0 0 20px rgba(201,163,94,.1)}
  50%{box-shadow:0 0 0 8px rgba(201,163,94,.0),0 0 40px rgba(201,163,94,.28)}
}
.ci-calendly:hover{background:rgba(201,163,94,.26);padding-left:30px;animation:none;box-shadow:0 0 40px rgba(201,163,94,.35)}
.ci-calendly-icon{font-size:26px;flex-shrink:0}
.ci-calendly-txt{display:flex;flex-direction:column;gap:4px;flex:1}
.ci-calendly-txt b{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-lt);font-weight:500}
.ci-calendly-txt span{font-size:12px;color:var(--muted);letter-spacing:.08em}
.form-card{background:var(--panel);border:1px solid var(--line);padding:clamp(28px,3.4vw,44px);box-shadow:0 40px 90px -50px rgba(0,0,0,.8)}
.form-card-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:30px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.form-card-title{font-size:clamp(24px,2.8vw,32px);color:var(--ivory)}
.form-card-note{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.contact-form-wrap form{display:flex;flex-direction:column;gap:26px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.field{position:relative}
.field input,.field textarea{width:100%;background:transparent;border:none;border-bottom:1px solid var(--line);padding:18px 2px 10px;font-family:'DM Sans',sans-serif;font-size:15px;color:var(--ivory);outline:none}
.field textarea{resize:vertical;min-height:96px;line-height:1.6}
.field label{position:absolute;left:2px;top:18px;font-size:15px;color:var(--muted);pointer-events:none;transition:all .3s var(--ease)}
.field.foc label,.field.filled label{top:-4px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.field-line{position:absolute;left:0;bottom:0;height:1px;width:0;background:linear-gradient(90deg,var(--gold),var(--gold-lt));transition:width .4s var(--ease)}
.field.foc .field-line{width:100%}
.contact-form-wrap{display:flex;flex-direction:column}
.contact-form-wrap .btn-gold.full{margin-top:6px}
.form-ok{background:var(--gold-dim);border:1px solid var(--gold);color:var(--gold-lt);padding:15px 18px;font-size:14px;margin-bottom:8px;line-height:1.5}

/* ═══ FOOTER ═══ */
.footer{background:#0E0B07;padding:clamp(56px,7vw,84px) var(--px) 34px;border-top:1px solid var(--line)}
.footer-top{display:flex;justify-content:space-between;align-items:center;gap:30px;flex-wrap:wrap;padding-bottom:36px;border-bottom:1px solid var(--line)}
.footer-brand{display:flex;align-items:center;gap:14px}
.footer-emblem{width:34px;height:36px}.footer-emblem .emblem-beam{animation:none}
.footer-name{font-family:'Cormorant Garamond',serif;font-size:24px;color:var(--ivory)}
.footer-role{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);margin-top:3px}
.footer-tag{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(18px,2vw,24px);color:var(--muted);font-weight:300}
.footer-bottom{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-top:24px;font-size:12px;letter-spacing:.04em;color:var(--muted-d)}

/* ═══ RESPONSIVE ═══ */
@media(max-width:1024px){
  .links-grid{grid-template-columns:repeat(2,1fr)}
  .journey-grid{grid-template-columns:1fr;gap:40px}
  .journey-sticky{position:static}
  .journey-intro{margin-bottom:24px}
  .journey-counter{display:none}
}
@media(max-width:860px){
  .nav-links{display:none}.nav-cta{display:none}.burger{display:flex}
  .about-grid{grid-template-columns:1fr;gap:40px}
  .about-portrait{max-width:360px}
  .stats-grid{grid-template-columns:repeat(2,1fr);gap:40px 24px}
  .svc-row{grid-template-columns:auto 1fr;gap:14px 22px}
  .svc-desc{grid-column:2;}.svc-arrow{display:none}
  .news-grid{grid-template-columns:1fr}
  .contact-grid{grid-template-columns:1fr;gap:44px}
  .journey-step{transform:none!important}
}
@media(max-width:560px){
  .links-grid{grid-template-columns:1fr}
  .frow{grid-template-columns:1fr}
  .hero-cta-row .btn{flex:1}
  .rev-card{width:280px}
  .reviews-head{flex-direction:column;align-items:flex-start}
  .ci-cities{grid-template-columns:1fr}
  .hero-info{padding:14px 18px}
  .hero-info::before{transform:scale(1.04)}
  .hero-info-item{font-size:10.5px;letter-spacing:.1em}
  .hero-info-phones{gap:14px}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .reveal,.fade-up,.stat{opacity:1!important;transform:none!important}
  .hero-letter-i{transform:none!important}
  .hero-emblem-draw{opacity:1!important;transform:none!important}
  .marquee-track,.rev-track{animation:none!important}
}
</style>
</head>
<body>
<div id="root"></div>
<script src="image-slot.js"></script>
<script src="lux-content.js"></script>
<script type="text/babel" src="lux-app.jsx"></script>
</body>

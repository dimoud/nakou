<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <!--
      ΑΡΧΕΙΟ-ΠΗΓΗ. Δεν ανεβαίνει ως σελίδα: το prerender.py το αποδίδει σε
      index.html (ελληνικά) και en/index.html (αγγλικά) με ΟΛΟ το κείμενο μέσα
      στο HTML. Περιεχόμενο αλλάζει ΜΟΝΟ στο config.js.
    -->
    <meta name="robots" content="noindex" data-src-only>
    <script>document.documentElement.className+=' js';if(!matchMedia('(prefers-reduced-motion: reduce)').matches)document.documentElement.classList.add('hl-pre');</script>
    <!-- Consent Mode v2 — ΟΛΑ «denied» πριν από οτιδήποτε gtag -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent','default',{analytics_storage:'denied',ad_storage:'denied',
        ad_user_data:'denied',ad_personalization:'denied',wait_for_update:500});
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <meta name="description" content="">
    <link rel="canonical" href="https://expertease.eu/nakou/">

    <meta property="og:type"        content="website">
    <meta property="og:url"         content="">
    <meta property="og:locale"      content="el_GR">
    <meta property="og:title"       content="">
    <meta property="og:description" content="">
    <meta name="twitter:card"       content="summary">
    <meta name="twitter:title"      content="">
    <link rel="icon" href="favicon.png" type="image/png" sizes="64x64">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="theme-color" content="#14100B">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Γραμματοσειρές ΜΕ ελληνικούς χαρακτήρες (η Cormorant Garamond και η DM Sans δεν έχουν) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:ital,wght@0,300;0,400;1,300&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="hero-letters.css">
    <link rel="stylesheet" href="expertease-credit.css">

    <!-- ΣΕΙΡΑ ΦΟΡΤΩΣΗΣ: πρώτα τα δεδομένα -->
    <script src="config.js"></script>
</head>
<body>

    <a class="skip-link" href="#main" data-i18n="a11y.skip">Μετάβαση στο περιεχόμενο</a>
    <div class="scroll-progress" id="progress" aria-hidden="true"></div>

    <!-- Το σήμα (ζυγαριά), μία φορά — το χρησιμοποιούν όλα τα <use href="#emb"> -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
        <symbol id="emb" viewBox="0 0 100 104">
            <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="50" cy="13" r="2.4"/><line x1="50" y1="16" x2="50" y2="86"/><line x1="40" y1="90" x2="60" y2="90"/>
                <g class="emblem-beam"><path d="M27 27 Q50 19 73 27"/><line x1="27" y1="27" x2="27" y2="34"/><line x1="73" y1="27" x2="73" y2="34"/>
                <path d="M17 34 Q27 52 37 34"/><path d="M63 34 Q73 52 83 34"/></g>
            </g>
        </symbol>
    </svg>

    <!-- ===== ΠΛΟΗΓΗΣΗ ===== -->
    <nav id="nav" class="nav">
        <a href="#top" class="nav-brand">
            <img class="nav-emblem" src="nakou-monogram-96.webp" alt="" width="48" height="29">
            <span class="nav-brand-name" data-i18n="brand.name"></span>
        </a>
        <div class="nav-links" id="navLinks">
            <button class="nav-close" type="button" aria-label="Κλείσιμο μενού" data-i18n-aria-label="nav.close"><span aria-hidden="true">&times;</span></button>
            <a href="#about"    data-i18n="nav.about"></a>
            <a href="#services" data-i18n="nav.services"></a>
            <a href="#efka"     data-i18n="nav.efka"></a>
            <a href="#reviews"  data-i18n="nav.reviews"></a>
            <a href="#contact"  class="nav-cta" data-i18n="nav.contact"></a>
        </div>
        <div class="nav-right">
            <div class="lang-toggle" id="langToggle">
                <a class="lang-btn active" data-lang="el" href="./" hreflang="el" lang="el" aria-label="Ελληνικά">ΕΛ</a>
                <span class="lang-sep" aria-hidden="true">/</span>
                <a class="lang-btn" data-lang="en" href="en/" hreflang="en" lang="en" aria-label="English">EN</a>
            </div>
            <button class="hamburger" id="hamburger" type="button" aria-controls="navLinks" aria-expanded="false"
                    aria-label="Μενού" data-i18n-aria-label="nav.menu"><span></span><span></span></button>
        </div>
    </nav>

    <main id="main">

    <!-- ===== ΠΡΩΤΗ ΟΘΟΝΗ ===== -->
    <header class="hero" id="top">
        <canvas class="hero-particles" id="heroParticles" aria-hidden="true"></canvas>
        <div class="hero-beam" aria-hidden="true"></div>
        <div class="hero-beam hero-beam-2" aria-hidden="true"></div>
        <div class="hero-glow" aria-hidden="true"></div>
        <div class="hero-emblem-bg" aria-hidden="true"><svg><use href="#emb"/></svg></div>
        <div class="hero-inner" id="heroInner">
            <p class="hero-badge" data-i18n="hero.badge"></p>
            <img class="hero-emblem" src="nakou-monogram-200.webp" alt="" width="100" height="60" fetchpriority="high">
            <h1 class="hero-name hl" data-letters data-step="42">
                <span class="hl-line" data-i18n="hero.first"></span>
                <span class="hl-line" data-i18n="hero.last"></span>
            </h1>
            <p class="hero-role" data-i18n="hero.role"></p>
            <div class="hero-rule" aria-hidden="true"></div>
            <p class="hero-tag" data-i18n="hero.tagline"></p>
            <div class="hero-cta-row">
                <a class="btn btn-gold" href="#contact" data-i18n="hero.cta1"></a>
                <a class="btn btn-ghost" href="#services" data-i18n="hero.cta2"></a>
            </div>
        </div>
        <div class="hero-info" id="heroInfo"><!-- site-init.js: τηλέφωνα, email, διεύθυνση --></div>
    </header>

    <!-- ===== ΚΥΛΙΟΜΕΝΗ ΤΑΙΝΙΑ ===== -->
    <div class="marquee" aria-hidden="true"><div class="marquee-track" id="marqueeTrack"></div></div>

    <!-- ===== ΠΡΟΦΙΛ ===== -->
    <section class="section about" id="about">
        <div class="wrap about-grid">
            <div class="about-portrait" data-reveal>
                <div class="portrait-frame">
                    <img id="portrait" src="" srcset="" sizes="(max-width: 860px) 324px, 486px" alt="" data-i18n-alt="img.person" width="486" height="486" loading="lazy" decoding="async">
                </div>
                <p class="portrait-cap"><img class="cap-emblem" src="nakou-monogram-96.webp" alt="" width="28" height="17" loading="lazy"><span data-i18n="about.cap"></span></p>
            </div>
            <div class="about-text">
                <p class="label" data-reveal data-i18n="about.label"></p>
                <h2 class="display" data-reveal data-i18n="about.heading"></h2>
                <ul class="about-bio-list" id="aboutPoints" data-reveal></ul>
            </div>
        </div>
    </section>

    <!-- ===== ΔΗΛΩΣΗ (λέξεις που φωτίζονται με την κύλιση) ===== -->
    <section class="manifesto" id="manifesto" aria-labelledby="manifestoText">
        <div class="manifesto-glow" aria-hidden="true"></div>
        <p class="manifesto-text" id="manifestoText"></p>
    </section>

    <!-- ===== ΥΠΗΡΕΣΙΕΣ ===== -->
    <section class="section services" id="services">
        <div class="wrap">
            <p class="label" data-reveal data-i18n="services.label"></p>
            <h2 class="display mb" data-reveal data-i18n="services.heading"></h2>
            <div class="svc-list" id="servicesList"></div>
        </div>
    </section>

    <!-- ===== ΠΩΣ ΔΟΥΛΕΥΟΥΜΕ ===== -->
    <section class="section journey" id="journey">
        <div class="wrap journey-grid">
            <div class="journey-aside">
                <div class="journey-sticky">
                    <p class="label" data-reveal data-i18n="journey.label"></p>
                    <h2 class="display on-dark" data-reveal data-i18n="journey.heading"></h2>
                    <p class="journey-intro" data-reveal data-i18n="journey.intro"></p>
                    <div class="journey-counter" id="journeyCounter" aria-hidden="true"></div>
                </div>
            </div>
            <ol class="journey-steps" id="journeySteps"></ol>
        </div>
    </section>

    <!-- ===== e-ΕΦΚΑ ===== -->
    <section class="section efka" id="efka">
        <div class="efka-glow" aria-hidden="true"></div>
        <div class="wrap efka-inner">
            <span class="efka-badge" data-reveal data-i18n="efka.badge"></span>
            <h2 class="efka-title" data-reveal data-i18n="efka.heading"></h2>
            <p class="efka-desc" data-reveal data-i18n="efka.text"></p>
            <a class="btn btn-gold" id="efkaLink" href="#" target="_blank" rel="noopener" data-reveal><span data-i18n="efka.cta"></span> <span class="arr" aria-hidden="true">→</span></a>
        </div>
    </section>

    <!-- ===== ΚΡΙΤΙΚΕΣ ===== -->
    <section class="section reviews" id="reviews">
        <div class="wrap reviews-head">
            <div>
                <p class="label" data-reveal data-i18n="reviews.label"></p>
                <h2 class="display" data-reveal data-i18n="reviews.heading"></h2>
            </div>
            <a class="g-badge" id="gBadge" href="#reviews" target="_blank" rel="noopener" data-reveal>
                <span class="g-logo" aria-hidden="true">G</span>
                <span><span class="g-stars"><span aria-hidden="true">★★★★★</span> <b>5.0</b></span><span class="g-sub" data-i18n="reviews.sub"></span></span>
            </a>
        </div>
        <div class="rev-rows" id="reviewRows"></div>
    </section>

    <!-- ===== ΝΕΑ + ΧΡΗΣΙΜΑ ===== -->
    <section class="section news-links" id="news">
        <div class="wrap">
            <p class="label" data-reveal data-i18n="news.label"></p>
            <h2 class="display" data-reveal data-i18n="news.heading"></h2>
            <div class="nl-news-grid" id="newsGrid"></div>
            <div class="nl-divider"><span class="nl-divider-label" data-i18n="links.label"></span></div>
        </div>
        <div class="links-scroll-wrap" id="linksWrap"><ul class="links-track" id="linksTrack"></ul></div>
    </section>

    <!-- ===== ΕΠΙΚΟΙΝΩΝΙΑ ===== -->
    <section class="section contact" id="contact">
        <div class="contact-bg" aria-hidden="true"></div>
        <div class="contact-emblem-bg" aria-hidden="true"><svg><use href="#emb"/></svg></div>
        <div class="wrap">
            <div class="contact-head">
                <p class="label" data-reveal data-i18n="contact.label"></p>
                <h2 class="display on-dark" data-reveal data-i18n="contact.heading"></h2>
                <p class="contact-sub" data-reveal data-i18n="contact.sub"></p>
            </div>
            <div class="contact-grid">
                <div class="contact-info" id="contactInfo" data-reveal><!-- site-init.js --></div>

                <div class="contact-form-wrap" data-reveal>
                    <div class="form-card">
                        <h3 class="form-card-title" data-i18n="form.title"></h3>
                        <form id="clientContactForm" novalidate>
                            <input type="hidden" name="_to"  value="gnakou.law@gmail.com">
                            <input type="hidden" name="_key" value="CHANGE_AFTER_APPS_SCRIPT">
                            <input type="text" name="_hp" value="" autocomplete="off" tabindex="-1" aria-hidden="true" class="hp">
                            <div class="field">
                                <label for="f-name" data-i18n="form.name"></label>
                                <input id="f-name" name="name" type="text" autocomplete="name" required>
                            </div>
                            <div class="frow">
                                <div class="field">
                                    <label for="f-email" data-i18n="form.email"></label>
                                    <input id="f-email" name="email" type="email" autocomplete="email" required>
                                </div>
                                <div class="field">
                                    <label for="f-phone" data-i18n="form.phone"></label>
                                    <input id="f-phone" name="phone" type="tel" autocomplete="tel">
                                </div>
                            </div>
                            <div class="field">
                                <label for="f-message" data-i18n="form.message"></label>
                                <textarea id="f-message" name="message" rows="4" required minlength="10"></textarea>
                            </div>
                            <button type="submit" class="btn btn-gold full" data-i18n="form.submit"></button>
                            <p id="formStatus" role="status" aria-live="polite"></p>
                            <p class="form-note" data-i18n="form.note"></p>
                        </form>
                    </div>
                </div>
            </div>
            <div class="contact-map" id="contactMap" data-reveal>
                <button type="button" class="map-load" id="mapLoad">
                    <img class="map-emb" src="nakou-monogram-96.webp" alt="" width="64" height="39" loading="lazy">
                    <span class="map-addr" data-i18n="contact.address"></span>
                    <span class="btn btn-ghost" data-i18n="map.show"></span>
                </button>
            </div>
        </div>
    </section>

    </main>

    <!-- ===== ΥΠΟΣΕΛΙΔΟ ===== -->
    <footer class="footer">
        <div class="wrap">
            <div class="footer-top">
                <div class="footer-brand">
                    <img class="footer-emblem" src="nakou-logo-240.webp" alt="Nakou Law" width="96" height="100" loading="lazy">
                    <div><p class="footer-name" data-i18n="brand.name"></p><p class="footer-role" data-i18n="hero.role"></p></div>
                </div>
                <p class="footer-tag" data-i18n="footer.tagline"></p>
            </div>
            <div class="footer-bottom">
                <a href="#contact" class="footer-link" id="footerPhone"></a>
                <a href="#contact" class="footer-link" id="footerEmail"></a>
                <button type="button" class="cc-settings-link" data-cc-open data-i18n="cc.settings">Ρυθμίσεις cookies</button>
            </div>
        </div>

        <hr class="ec-rule">
        <div class="expertease-credit">
          <div class="ec-layer ec-layer--credit">
            <span class="ec-copy">© <span id="ecYear">2026</span> · <span data-i18n="ec.rights">Με επιφύλαξη παντός δικαιώματος</span></span>
            <span class="ec-divider"></span>
            <a href="https://expertease.eu/webdesign" target="_blank" rel="noopener" class="ec-brand">
              <span class="ec-label" data-i18n="ec.by">Σχεδίαση</span>
              <img src="logo_expertease.webp" alt="" class="ec-logo" width="20" height="20" loading="lazy">
              <span class="ec-name">Expertease Designs</span>
            </a>
          </div>
          <div class="ec-layer ec-layer--ad">
            <div class="ec-ad-ring"><div class="ec-ad-logo"><img src="logo_expertease.webp" alt="" width="16" height="16" loading="lazy"></div></div>
            <div class="ec-ad-text">
              <span class="ec-ad-question" data-i18n="ec.like">Σας αρέσει ο ιστότοπος;</span>
              <a href="https://expertease.eu/webdesign" target="_blank" rel="noopener" class="ec-ad-cta">
                <span data-i18n="ec.cta">Φτιάχνουμε και τον δικό σας</span>
                <span class="ec-ad-arrow"><svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><line x1="2" y1="6.5" x2="11" y2="6.5"/><polyline points="7,2.5 11,6.5 7,10.5"/></svg></span>
              </a>
            </div>
          </div>
        </div>
    </footer>

    <!-- Μπάρα κινητού: κλήση με ένα πάτημα (μόνο < 861px) -->
    <div class="mcb" id="mobileCallBar">
        <a class="mcb-call" id="mcbCall" href="#contact"><span aria-hidden="true">☎</span> <span data-i18n="mcb.call"></span></a>
        <a class="mcb-msg" href="#contact"><span aria-hidden="true">✉</span> <span data-i18n="mcb.msg"></span></a>
    </div>
    <button type="button" class="scroll-top" id="backToTop" aria-label="Επιστροφή επάνω" data-i18n-aria-label="a11y.top">↑</button>

    <!-- ΣΕΙΡΑ: site-init (χτίζει) → i18n (γλώσσα) → κίνηση (βλέπει ό,τι χτίστηκε) -->
    <script src="site-init.js"></script>
    <script src="i18n.js"></script>
    <script src="hero-letters.js"></script>
    <script src="animations.js"></script>
    <script src="contact-form.js"></script>
    <script src="consent.js"></script>
</body>
</html>
